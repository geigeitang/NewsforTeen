<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>每日时政 · 中学生版</title>
<style>
  :root{
    --brand:#c8102e;        /* 中国红 */
    --brand-soft:#fff1f2;
    --ink:#1f2329;
    --ink-2:#5b6470;
    --line:#eceff3;
    --bg:#f5f6f8;
    --card:#ffffff;
    --tag-bg:#eef4ff;
    --tag-ink:#2f6bff;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 14px 36px;}
  header{
    background:linear-gradient(135deg,#c8102e,#e23b4e);
    color:#fff;padding:22px 18px 18px;border-radius:0 0 22px 22px;
    box-shadow:0 6px 18px rgba(200,16,46,.18);
  }
  .brand{font-size:13px;opacity:.92;letter-spacing:.5px}
  h1{font-size:22px;margin:6px 0 4px;font-weight:800;letter-spacing:.5px}
  .sub{font-size:12.5px;opacity:.9}
  .datebar{
    display:flex;align-items:center;justify-content:space-between;
    margin:14px 2px 6px;font-size:13px;color:var(--ink-2)
  }
  .datebar b{color:var(--ink);font-weight:700}
  .pill{background:#fff;color:var(--brand);font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:999px}
  .card{
    background:var(--card);border-radius:var(--radius);padding:16px 16px 14px;
    margin-top:14px;box-shadow:0 2px 10px rgba(20,30,50,.05);
    border:1px solid var(--line);
  }
  .tag{display:inline-block;background:var(--tag-bg);color:var(--tag-ink);
    font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:9px}
  .card h2{font-size:17.5px;line-height:1.4;margin:0 0 8px;font-weight:800}
  .meta{font-size:12px;color:var(--ink-2);margin-bottom:10px}
  .summary{font-size:14.5px;color:#2b313a;margin:0 0 12px}
  .why{
    background:var(--brand-soft);border-left:3px solid var(--brand);
    border-radius:0 10px 10px 0;padding:10px 12px;font-size:13.5px;color:#7a2230;margin-bottom:12px
  }
  .why b{color:var(--brand)}
  .read{
    display:inline-flex;align-items:center;gap:5px;text-decoration:none;
    background:var(--brand);color:#fff;font-size:13.5px;font-weight:700;
    padding:9px 16px;border-radius:999px;
  }
  .read:active{opacity:.85}
  footer{margin-top:22px;text-align:center;font-size:11.5px;color:#9aa3ad}
  .tip{margin-top:10px;font-size:11.5px;color:#9aa3ad;text-align:center}
  .essay{
    background:linear-gradient(135deg,#1f3a8a,#2f6bff);
    color:#fff;border-radius:var(--radius);padding:18px 16px 16px;margin-top:18px;
    box-shadow:0 6px 18px rgba(31,58,138,.18);
  }
  .essay .ebadge{font-size:12px;opacity:.92;letter-spacing:.5px;margin-bottom:6px}
  .essay h3{font-size:18px;margin:0 0 2px;font-weight:800}
  .essay .etitle{font-size:15px;font-weight:700;margin:8px 0 12px;line-height:1.4}
  .essay .esub{font-size:12px;opacity:.9;margin-bottom:12px}
  .essay .box{background:rgba(255,255,255,.14);border-radius:12px;padding:11px 13px;margin-bottom:10px}
  .essay .box .lbl{font-size:11.5px;font-weight:700;opacity:.85;margin-bottom:5px;letter-spacing:.5px}
  .essay .box p{margin:0;font-size:13.5px;line-height:1.6}
  .essay .q{background:rgba(255,255,255,.18);border-radius:12px;padding:11px 13px;margin-bottom:10px}
  .essay .q .lbl{font-size:11.5px;font-weight:700;opacity:.85;margin-bottom:5px}
  .essay .q p{margin:0;font-size:13.5px;line-height:1.6}
  .read2{
    display:inline-flex;align-items:center;gap:5px;text-decoration:none;
    background:#fff;color:#1f3a8a;font-size:13.5px;font-weight:700;
    padding:9px 16px;border-radius:999px;
  }
  .read2:active{opacity:.85}
  .essay .ehint{font-size:11.5px;opacity:.88;margin:8px 2px 12px;text-align:center;letter-spacing:.3px}
  .writing{
    background:linear-gradient(135deg,#0f7a4d,#23a06b);
    color:#fff;border-radius:var(--radius);padding:18px 16px 16px;margin-top:18px;
    box-shadow:0 6px 18px rgba(15,122,77,.18);
  }
  .writing .wbadge{font-size:12px;opacity:.92;letter-spacing:.5px;margin-bottom:6px}
  .writing h3{font-size:18px;margin:0 0 10px;font-weight:800}
  .writing .wcard{background:rgba(255,255,255,.14);border-radius:12px;padding:12px 13px;margin-bottom:12px}
  .writing .wcard .wt{font-size:14.5px;font-weight:800;margin:0 0 8px}
  .writing .wcard .wmeta{font-size:12px;opacity:.85;margin-bottom:8px}
  .writing .wcard .lbl{font-size:11.5px;font-weight:700;opacity:.85;margin:9px 0 4px;letter-spacing:.5px}
  .writing .wcard p{margin:0;font-size:13.5px;line-height:1.6}
  .writing .wcard .fit{margin-top:8px}
  .writing .wcard .fit span{display:inline-block;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px;margin:4px 5px 0 0;font-size:11.5px}
  .writing .wcard .ph{font-size:13px;margin-top:5px;font-style:italic;opacity:.96}
  .writing .wp{background:rgba(255,255,255,.18);border-radius:12px;padding:11px 13px;margin-bottom:10px}
  .writing .wp .lbl{font-size:11.5px;font-weight:700;opacity:.85;margin-bottom:5px}
  .writing .wp p{margin:0;font-size:13.5px;line-height:1.6}
</style>
</head>

  function render(data){
    document.getElementById("dateLabel").innerHTML = "<b>"+data.date+"</b> · "+data.weekday;
    document.getElementById("count").textContent = (data.articles?data.articles.length:0)+" 篇精选";
    var html = "";
    data.articles.forEach(function(a){
      html += '<div class="card">'
            + '<span class="tag">'+a.tag+'</span>'
            + '<h2>'+a.title+'</h2>'
            + '<div class="meta">'+a.source+' · '+a.date+'</div>'
            + '<p class="summary">'+a.summary+'</p>'
            + '<div class="why"><b>为什么值得读：</b>'+a.why+'</div>'
            + '<a class="read" href="'+a.url+'" target="_blank" rel="noopener">阅读原文 ›</a>'
            + '</div>';
    });
    document.getElementById("list").innerHTML = html;
  }

  function renderEssay(e){
    var box = document.getElementById("essayBox");
    if(!e || !e.title){ box.innerHTML = ""; return; }
    var html = '<div class="essay">'
      + '<div class="ebadge">📝 议论文精读 · 提升语文阅读能力</div>'
      + '<h3>今日议论文精读</h3>'
      + '<div class="etitle">《'+e.title+'》</div>'
      + '<div class="esub">'+e.source+' · '+e.date+'</div>'
      + '<div class="box"><div class="lbl">内容速览</div><p>'+e.summary+'</p></div>';
    if(e.url){
      html += '<a class="read2" href="'+e.url+'" target="_blank" rel="noopener">阅读原文 ›</a>'
            + '<div class="ehint">👉 先读原文，再往下对照中心论点、分论点</div>';
    }
    html += '<div class="box"><div class="lbl">中心论点</div><p>'+e.thesis+'</p></div>';
    if(e.arguments && e.arguments.length){
      html += '<div class="box"><div class="lbl">分论点 / 论据</div><p>'+e.arguments.map(function(a,k){return (k+1)+'. '+a;}).join('<br>')+'</p></div>';
    }
    if(e.methods){ html += '<div class="box"><div class="lbl">论证方法</div><p>'+e.methods+'</p></div>'; }
    if(e.quotes && e.quotes.length){
      html += '<div class="box"><div class="lbl">金句摘抄</div><p>'+e.quotes.map(function(q){return '“'+q+'”';}).join('<br>')+'</p></div>';
    }
    html += '<div class="q"><div class="lbl">💡 思考练习</div><p>'+e.practice+'</p></div>';
    html += '</div>';
    box.innerHTML = html;
  }

  function renderWriting(w){
    var box = document.getElementById("writingBox");
    if(!w){ box.innerHTML = ""; return; }
    var html = '<div class="writing">'
      + '<div class="wbadge">✍️ 中考作文素材 · 积累每一天（紧贴上海中考）</div>'
      + '<h3>今日作文素材积累</h3>';
    if(w.news){
      var n = w.news;
      html += '<div class="wcard">'
        + '<div class="wt">📰 当日时政素材 · '+ (n.theme||"") +'</div>';
      if(n.from){ html += '<div class="wmeta">来源：'+ n.from +'</div>'; }
      if(n.material){ html += '<div class="lbl">素材速写</div><p>'+ n.material +'</p>'; }
      if(n.angle){ html += '<div class="lbl">立意角度</div><p>'+ n.angle +'</p>'; }
      if(n.fit && n.fit.length){ html += '<div class="lbl">适配命题 / 主题</div><div class="fit">'+ n.fit.map(function(f){return '<span>'+f+'</span>';}).join('') +'</div>'; }
      if(n.phrases && n.phrases.length){ html += '<div class="lbl">好词好句</div><div class="ph">'+ n.phrases.map(function(p){return '“'+p+'”';}).join('<br>') +'</div>'; }
      html += '</div>';
    }
    if(w.classic){
      var c = w.classic;
      html += '<div class="wcard">'
        + '<div class="wt">📚 经典通用素材 · '+ (c.theme||"") +'</div>';
      if(c.type){ html += '<div class="wmeta">类型：'+ c.type +'</div>'; }
      if(c.material){ html += '<div class="lbl">素材内容</div><p>'+ c.material +'</p>'; }
      if(c.angle){ html += '<div class="lbl">立意角度</div><p>'+ c.angle +'</p>'; }
      if(c.fit && c.fit.length){ html += '<div class="lbl">适配命题 / 主题</div><div class="fit">'+ c.fit.map(function(f){return '<span>'+f+'</span>';}).join('') +'</div>'; }
      if(c.phrases && c.phrases.length){ html += '<div class="lbl">好词好句</div><div class="ph">'+ c.phrases.map(function(p){return '“'+p+'”';}).join('<br>') +'</div>'; }
      html += '</div>';
    }
    if(w.practice){ html += '<div class="wp"><div class="lbl">💡 微练笔</div><p>'+ w.practice +'</p></div>'; }
    html += '</div>';
    box.innerHTML = html;
  }

  if(DATA_URL){
    fetch(DATA_URL, {cache:"no-store"}).then(function(r){return r.json();})
      .then(function(d){ if(d && d.articles && d.articles.length){ render(d); renderEssay(d.essay); renderWriting(d.writing); } else { render(DEFAULT); renderEssay(DEFAULT.essay); renderWriting(DEFAULT.writing); } })
      .catch(function(){ render(DEFAULT); renderEssay(DEFAULT.essay); renderWriting(DEFAULT.writing); });
  } else {
    render(DEFAULT);
    renderEssay(DEFAULT.essay);
    renderWriting(DEFAULT.writing);
  }
</script>
</body>
</html>
